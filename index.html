<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">   
<title>Portal Attento</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
<link href="style.css" rel="stylesheet">

</head>
<body>

<main class="col-lg-12 ">
<!-- Lado esquerdo -->
  <div class="row col-lg-4 border px-0 " style="background-color: #5B88C5; height: 100%;" >
    <!-- Espaço para o logo -->
    <div class="container row d-flex justify-content-center align-items-center text-center" style="height: 50%;">
      <img src="assets/web-app-manifest-512x512-white.png" alt="Logo completa" class="img-fluid" style="max-width:90%; max-height: 90%;">
      <h4 style="color: #ffffff83; font-family: Verdana, 'Arial', sans-serif">Cuidado pleno com sua saúde mental</h4>
    </div>
   
    <!-- Espaço  para separar o logo do lineart -->
    <div class="row d-inline-block justify-content-center align-items-center" style="height: 10%;">
    </div>

      <!-- Espaço para o lineart -->
    <div class="container row d-inline-block lineart " style="height: 40%;">
        <img src="assets/web-app-manifest-512x512-white-lineart2.png" alt="Logo lineart" class="px-0" style="max-width: 30%; max-height: 100%;"> </div></div>


<!-- Lado direito --> 
  <div class="col-lg-8 float-end border d-inline-block" style="background-color: rgb(255, 255, 255); height: 100%;" >
    <!-- Espaço para o formulário -->
    <div class="container d-flex justify-content-center align-items-center" style="height: 100%; width: 100%;">   
      <form>
            <div class="row d-inline-block justify-content-center align-items-center mb-3" style="height: 20%;">
              <h1 class="text-center">Bem-vindo(a)!</h1>  
              <h3 class="text-center" style="color: #6c757d;">Faça login para acessar o sistema</h3> 
            </div>
          
          <div class="form-floating">
            <input type="email" class="form-control" id="user" placeholder="Usuário">
            <label for="user">Usuário</label></div>

          <div class="form-floating">
            <input type="password" class="form-control" id="senha" placeholder="Senha">
            <label for="senha">Senha</label></div>

        
            <button class="w-100 btn btn-lg btn-primary" type="submit" href="dashboard.html">Entrar</button>
            <!----------------------FAZER VALIDAÇÃO NO JS----------------------------->
      </form>
   </div>
</div>
   
</main>
<script src="script.js"></script>
</body>

</html>
