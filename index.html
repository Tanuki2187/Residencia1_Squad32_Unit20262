<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Attento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <!-- Left Panel -->
       <div class="lado-esquerdo" >
       <img src="assets/web-app-manifest-512x512-white.png" alt="Logo completa" class="img-fluid" style="max-width:90%; max-height: 90%;">
       <h4 style="color: #ffffff83; font-family: Verdana, 'Arial', sans-serif">Cuidado pleno com sua saúde mental</h4>
    </div>
    
       <svg class="lineart" >
        <image href="assets/web-app-manifest-512x512-white-lineart2.png" alt="Logo lineart"  /> 
       </svg>
          

        <!-- Right Panel -->
        <div class="lado-direito">
            <div class="login-box">
                <h2>Bem-vindo(a)!</h2>
                <p>Faça login para acessar o sistema</p>
                
                <form class="login-form">
                    <input type="text" placeholder="Usuário" required>
                    <input type="password" placeholder="Senha" required>
                    <button type="submit" href="dashboard.html">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
